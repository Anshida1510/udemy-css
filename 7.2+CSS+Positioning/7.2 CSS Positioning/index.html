<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    body{
      margin: 0;
    }
    .blue-box{
      width: 500px;
      height: 300px;
      background-color: blue;
      position: absolute;
      top: 200px;
      left: 200px;
    }
    .red-circle{
      width: 150px;
      height: 150px;
      background-color: red;
      border-radius: 50%;
      position: absolute;
      left: 250px;
      bottom: -75px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
